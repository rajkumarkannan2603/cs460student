<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PolyCam Model — Babylon.js WebGPU</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      #renderCanvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #message {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 1;
        padding: 8px 12px;
        color: #fff;
        background: rgba(0, 0, 0, 0.65);
        font: 14px Arial, sans-serif;
      }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylon.glTF2FileLoader.min.js"></script>
  </head>
  <body>
    <div id="message">Starting WebGPU…</div>
    <canvas id="renderCanvas"></canvas>

    <script type="module">
      const canvas = document.getElementById("renderCanvas");
      const message = document.getElementById("message");

      try {
        const engine = new BABYLON.WebGPUEngine(canvas, {
          antialiasing: true,
        });
        await engine.initAsync();

        const scene = new BABYLON.Scene(engine);
        await BABYLON.SceneLoader.AppendAsync("./", "poly.glb", scene);

        scene.createDefaultCameraOrLight(true, true, true);
        scene.activeCamera.attachControl(canvas, true);

        message.remove();
        engine.runRenderLoop(() => scene.render());
        window.addEventListener("resize", () => engine.resize());
      } catch (error) {
        console.error(error);
        message.textContent =
          "Could not start WebGPU or load poly.glb. Check browser WebGPU support and the file path.";
      }
    </script>
  </body>
</html>
